[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # La clave "anon" de Supabase y las direcciones son públicas por diseño (viajan dentro de la web).
  # Sin esto, el escáner de secretos de Netlify las encuentra en el resultado y corta el despliegue.
  # Modo de prueba: cualquiera entra como invitado (sin Google). Borrar esta línea antes de abrir al público.
  VITE_GUEST_MODE = "true"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_APP_URL"

# La app es una SPA: /s/:uuid, /panel, etc. caen siempre en index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # La cámara es solo para esta app (escáner); el resto de permisos sensibles, cerrados.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# Archivos con hash en el nombre: cache largo. El service worker y el manifest, siempre frescos.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
